<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A log of repositories I've starred on GitHub.">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">A personal archive</p>
        <h1>Stargazers log</h1>
        <p class="intro">A log of repositories I've starred.</p>
      </header>

      <section class="starred-section" aria-labelledby="starred-heading">
        <div class="section-heading">
          <h2 id="starred-heading">Recently starred</h2>
          <span id="event-count" class="event-count" aria-label="Number of starred repositories">--</span>
        </div>
        <p id="status" class="status" role="status">Loading starred repositories...</p>
        <ol id="events-list" class="events-list" aria-live="polite"></ol>
      </section>
    </main>
  </body>
</html>
